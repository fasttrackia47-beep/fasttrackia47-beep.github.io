<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Проекты — FastTrack AI</title>
    <meta
      name="description"
      content="Каталог прототипов и интерфейсных проектов FastTrack AI, опубликованных на GitHub Pages."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fasttrackia47-beep.github.io/" />
    <meta property="og:title" content="Проекты — FastTrack AI" />
    <meta
      property="og:description"
      content="Каталог прототипов и интерфейсных проектов FastTrack AI, опубликованных на GitHub Pages."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f5f4fa" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #24212b;
        background: #f5f4fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 15% 10%, rgb(112 71 254 / 12%), transparent 32rem),
          #f5f4fa;
      }

      main {
        width: min(100% - 32px, 960px);
        margin-inline: auto;
        padding-block: clamp(56px, 10vw, 112px);
      }

      header {
        max-width: 680px;
        margin-bottom: 40px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(36px, 7vw, 64px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      header p {
        margin: 0;
        color: #625e6d;
        font-size: clamp(17px, 2.5vw, 20px);
        line-height: 1.55;
      }

      .projects {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .project-card a {
        min-height: 180px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
        border: 1px solid rgb(40 38 53 / 10%);
        border-radius: 24px;
        color: inherit;
        background: rgb(255 255 255 / 78%);
        box-shadow: 0 12px 40px rgb(40 38 53 / 8%);
        text-decoration: none;
        backdrop-filter: blur(20px);
        transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
      }

      .project-card a:hover {
        transform: translateY(-3px);
        border-color: rgb(112 71 254 / 35%);
        box-shadow: 0 18px 50px rgb(40 38 53 / 12%);
      }

      .project-card a:focus-visible {
        outline: 3px solid #7047fe;
        outline-offset: 3px;
      }

      .project-card h2 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.25;
      }

      .project-card p {
        margin: 0;
        color: #625e6d;
        line-height: 1.5;
      }

      .project-card span {
        color: #7047fe;
        font-weight: 600;
      }

      @media (prefers-reduced-motion: reduce) {
        .project-card a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Проекты</h1>
        <p>Прототипы и интерфейсные эксперименты FastTrack AI, доступные на GitHub Pages.</p>
      </header>

      <!-- Чтобы добавить проект, скопируйте один элемент <li> и измените ссылку, название и описание. -->
      <ul class="projects">
        <li class="project-card">
          <a href="/collapse-chat-ui-federation/">
            <div>
              <h2>Collapse Chat — Федерация</h2>
              <p>Прототип чатов с межорганизационными сценариями и компонентами дизайн-системы Collapse.</p>
            </div>
            <span>Открыть проект →</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
