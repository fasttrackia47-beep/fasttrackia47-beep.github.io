<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Анкета «Полный разбор матрицы»</title>
  <meta name="description" content="Анкета «Полный разбор матрицы» для персонального разбора Матрицы судьбы.">
  <style>
    @font-face{font-family:Rubik;src:url('/katya-matrix/assets/fonts/Rubik.ttf') format('truetype');font-weight:300 900;font-display:swap}
    @font-face{font-family:Playfair;src:url('/katya-matrix/assets/fonts/PlayfairDisplay.ttf') format('truetype');font-weight:400 900;font-display:swap}
    :root{--ink:#303642;--body:#596670;--accent:#596aa4;--accent-hover:#47588e;--line:#dde2e8;--field:#fbfcfd;--error:#a33f3b}
    *{box-sizing:border-box}html{min-height:100%;background:#eff6f6}body{margin:0;min-height:100vh;color:var(--ink);font-family:Rubik,Arial,sans-serif;background:radial-gradient(ellipse 64% 90% at 12% 15%,#d8efef 0,transparent 73%),radial-gradient(ellipse 58% 78% at 94% 88%,#e7e0f5 0,transparent 75%),linear-gradient(118deg,#f4fbfb,#f7f9fc 52%,#f1edf8)}
    button,input,textarea{font:inherit}.page{width:min(100% - 32px,1080px);margin:auto;padding:16px 0 48px}.top{height:72px;display:flex;align-items:center;justify-content:center}.logo{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:24px;font-weight:750;text-decoration:none;letter-spacing:-1px}.logo svg{width:32px;height:32px}.card{width:min(100%,720px);margin:clamp(20px,8vh,90px) auto 0;padding:clamp(28px,5vw,56px);border-radius:32px;background:#fff;box-shadow:0 20px 70px rgb(53 69 85 / .09)}
    .meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:24px;color:var(--body);font-size:12px}.progress{height:3px;background:#edf0f4;border-radius:3px;overflow:hidden;margin-bottom:30px}.progress i{display:block;height:100%;width:var(--progress,0%);background:var(--accent);transition:width .25s ease}.gate .meta,.gate .progress{display:none}.kicker{display:block;margin-bottom:12px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.12em}.stage h1{margin:0 0 16px;font:700 clamp(34px,5vw,48px)/1.08 Playfair,Georgia,serif;letter-spacing:-.025em}.lead{max-width:60ch;margin:0 0 30px;color:var(--body);font-size:16px;line-height:1.55}.gate-guidance{max-width:62ch;margin:0;color:var(--body);font-size:16px;line-height:1.55}.gate-guidance strong{color:var(--ink)}.label,fieldset legend{display:block;margin-bottom:8px;font-size:14px;font-weight:700}.field,textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:14px;background:var(--field);padding:0 16px;color:var(--ink);outline:0}.field:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgb(89 106 164 / .12)}textarea{min-height:150px;padding:15px 16px;resize:vertical;line-height:1.5}.error{margin:9px 0 0;color:var(--error);font-size:13px;line-height:1.4}.hint{margin:14px 0 0;color:var(--body);font-size:12px;line-height:1.45}.primary,.secondary{min-height:56px;border:0;border-radius:14px;padding:0 20px;font-weight:700;cursor:pointer}.primary{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:24px;background:var(--accent);color:#fff;text-decoration:none}.primary:hover{background:var(--accent-hover)}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#f1f3f7;color:var(--body)}.actions{display:flex;gap:12px;margin-top:24px}.actions .primary{margin:0}.identity{border:0;padding:0;margin:24px 0 0}.identity-options{display:grid;grid-template-columns:repeat(2,80px);gap:8px}.identity-options label{min-height:50px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;cursor:pointer}.identity-options label:has(input:checked){border-color:var(--accent);background:#f0f2fa;color:var(--accent);font-weight:700}.identity-options input{position:absolute;opacity:0}.date-grid{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:10px}.date-grid label{font-size:13px}.options{display:grid;gap:10px}.option{min-height:58px;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.option[data-selected=true]{border-color:var(--accent);background:#f2f4fb}.option b{margin-left:auto;width:18px;height:18px;border:1px solid #bac2cb;border-radius:50%}.option[data-selected=true] b{border:5px solid var(--accent)}.count{display:block;margin-top:7px;color:var(--body);font-size:11px;text-align:right}.summary{display:grid;gap:0}.summary div{padding:16px 0;border-top:1px solid var(--line)}.summary span{display:block;margin-bottom:5px;color:var(--body);font-size:12px}.summary strong{font-size:15px;line-height:1.5;overflow-wrap:anywhere}.success{width:64px;height:64px;display:grid;place-items:center;margin-bottom:22px;border-radius:50%;background:#edf7f1;color:#2f7b55;font-size:28px}.notice{margin-top:24px;padding:18px;border-radius:14px;background:#f5f7fa;color:var(--body);font-size:13px;line-height:1.5}.footer{margin:32px auto 0;text-align:center;color:var(--body);font-size:11px}
    .meta{margin-bottom:28px}.gate .meta{display:none}.text-back{border:0;padding:0;background:transparent;color:var(--body);font-weight:600;cursor:pointer}.status-center{text-align:center}.status-center .lead{margin-inline:auto}.status-center .success{margin-inline:auto}.send-progress{width:min(100%,420px);height:8px;margin:28px auto 18px;overflow:hidden;border-radius:999px;background:#edf0f4}.send-progress i{display:block;width:42%;height:100%;border-radius:inherit;background:var(--accent);animation:send-progress 1.25s ease-in-out infinite}.status-center small{color:var(--body)}.help-box{max-width:520px;margin:30px auto 0;padding:22px 24px;border-radius:16px;background:#f5f7fa;text-align:left}.help-box p{margin:7px 0;color:var(--body);line-height:1.5}.help-box a{color:var(--accent);font-weight:700;text-decoration:none}@keyframes send-progress{0%{transform:translateX(-125%)}100%{transform:translateX(340%)}}
    @media(max-width:620px){.page{width:min(100% - 20px,1080px);padding-top:8px}.top{height:58px}.logo{font-size:20px}.home{font-size:0}.home:after{content:'← На сайт';font-size:12px}.card{margin-top:14px;padding:26px 20px;border-radius:24px}.stage h1{font-size:36px}.date-grid{gap:7px}.date-grid .field{padding-inline:10px}.actions{display:grid}.actions .secondary{order:2}.identity-options{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="page">
    <header class="top"><span class="logo" aria-label="Матрица"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect x="8" y="8" width="24" height="24" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="8" y="8" width="24" height="24" rx="2" stroke="currentColor" stroke-width="1.8" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="3" fill="currentColor"/></svg>матрица</span></header>
    <main class="card gate" id="form-root" aria-live="polite"></main>
  </div>
  <script>window.MATRIX_BASE='/katya-matrix';window.MATRIX_PRODUCT_ID='full';window.MATRIX_PRODUCT_TITLE='Полный разбор матрицы';</script>
  <script src="/katya-matrix/access/app.js" defer></script>
</body>
</html>
