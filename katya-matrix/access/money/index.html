<!doctype html>
<html lang="ru">
<head>

  <title>Анкета «Путь к деньгам»</title>

  <style>
    @font-face{font-family:Rubik;src:url('/katya-matrix/assets/fonts/Rubik.ttf') format('truetype');font-weight:300 900;font-display:swap}
    @font-face{font-family:Playfair;src:url('/katya-matrix/assets/fonts/PlayfairDisplay.ttf') format('truetype');font-weight:400 900;font-display:swap}
    :root{--ink:#303642;--body:#596670;--accent:#596aa4;--accent-hover:#47588e;--line:#dde2e8;--field:#fbfcfd;--error:#a33f3b}
    *{box-sizing:border-box}html{min-height:100%;background:#eff6f6}body{margin:0;min-height:100vh;color:var(--ink);font-family:Rubik,Arial,sans-serif;background:radial-gradient(ellipse 64% 90% at 12% 15%,#d8efef 0,transparent 73%),radial-gradient(ellipse 58% 78% at 94% 88%,#e7e0f5 0,transparent 75%),linear-gradient(118deg,#f4fbfb,#f7f9fc 52%,#f1edf8)}
    button,input,textarea{font:inherit}.page{width:min(100% - 32px,1080px);margin:auto;padding:16px 0 48px}.top{height:72px;display:flex;align-items:center;justify-content:center}.logo{display:flex;align-items:center;gap:9px;color:var(--ink);font-size:24px;font-weight:750;text-decoration:none;letter-spacing:-1px}.logo svg{width:32px;height:32px}.card{width:min(100%,720px);margin:clamp(20px,8vh,90px) auto 0;padding:clamp(28px,5vw,56px);border-radius:32px;background:#fff;box-shadow:0 20px 70px rgb(53 69 85 / .09)}

    .meta{margin-bottom:28px}.gate .meta{display:none}.text-back{border:0;padding:0;background:transparent;color:var(--body);font-weight:600;cursor:pointer}.status-center{text-align:center}.status-center .lead{margin-inline:auto}.status-center .success{margin-inline:auto}.send-progress{width:min(100%,420px);height:8px;margin:28px auto 18px;overflow:hidden;border-radius:999px;background:#edf0f4}.send-progress i{display:block;width:42%;height:100%;border-radius:inherit;background:var(--accent);animation:send-progress 1.25s ease-in-out infinite}.status-center small{color:var(--body)}.help-box{max-width:520px;margin:30px auto 0;padding:22px 24px;border-radius:16px;background:#f5f7fa;text-align:left}.help-box p{margin:7px 0;color:var(--body);line-height:1.5}.help-box a{color:var(--accent);font-weight:700;text-decoration:none}@keyframes send-progress{0%{transform:translateX(-125%)}100%{transform:translateX(340%)}}
    body.plain-outcome,body.plain-outcome html{background:#fff}.plain-outcome .page{width:min(100% - 32px,1080px);min-height:100svh;display:flex;flex-direction:column;padding-bottom:32px}.plain-outcome .top{flex:none}.outcome-card{width:100%;max-width:760px;min-height:0;margin:auto;padding:40px 20px;background:transparent;border:0;border-radius:0;box-shadow:none}.outcome-content{max-width:620px;margin:auto;text-align:center}.outcome-content h1{margin:0 0 18px;font:700 clamp(32px,4.5vw,48px)/1.13 Playfair,Georgia,serif;letter-spacing:-.025em}.outcome-content>.lead{max-width:56ch;margin:0 auto;color:var(--body);font-size:16px;line-height:1.6}.outcome-content .success{width:72px;height:72px;margin:0 auto 28px;background:#f0edf9;color:#655594;font-size:32px}.outcome-content .help-box{margin:36px auto 0;padding:26px 28px;border:1px solid var(--line);border-radius:20px;background:#fbfafc;text-align:center}.outcome-content .help-box strong{font-size:17px}.outcome-content .help-box p{margin:8px 0 20px;font-size:15px}.contact-link{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:46px;padding:0 18px;border-radius:12px;background:#eeeaf7;color:#4f4381;font-size:14px;font-weight:700;text-decoration:none}.contact-link:hover{background:#e4ddf3}.contact-link:focus-visible,.text-back:focus-visible,.primary:focus-visible,.secondary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.date-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.date-grid label{min-width:0;font-weight:700}.date-grid .field{margin-top:8px}.actions .secondary{flex:0 0 auto}.actions .primary{flex:1;min-width:0}.stage{min-width:0}.stage h1{overflow-wrap:break-word}@media(max-width:760px){.page{width:min(100% - 28px,760px);padding-top:12px}.card{margin-top:36px;padding:36px 32px}.stage h1{font-size:clamp(32px,5.4vw,42px)}.top{height:64px}}@media(max-width:620px){.page,.plain-outcome .page{width:100%;padding:0 16px 28px}.top{height:76px}.logo{font-size:22px}.logo svg{width:30px;height:30px}.card{width:100%;margin-top:12px;padding:28px 22px;border-radius:24px}.stage h1{font-size:clamp(29px,8vw,36px);line-height:1.14;letter-spacing:-.02em}.lead,.gate-guidance{font-size:15px;line-height:1.55;margin-bottom:24px}.gate-guidance{margin-bottom:0}.meta{margin-bottom:22px}.date-grid{gap:8px}.date-grid .field{min-height:54px;padding:0 10px;font-size:16px}.field,textarea{font-size:16px}.primary,.secondary{min-height:54px;padding:0 16px;font-size:15px}.actions{display:grid;grid-template-columns:1fr;gap:10px}.actions .secondary{order:2}.summary div{padding:14px 0}.summary strong{font-size:14px}.outcome-card{margin:auto;padding:24px 4px;border-radius:0}.outcome-content h1{font-size:clamp(30px,8vw,38px)}.outcome-content>.lead{font-size:15px}.outcome-content .success{width:64px;height:64px;margin-bottom:24px}.outcome-content .help-box{margin-top:28px;padding:22px 18px}.contact-link{width:100%;min-height:48px}.status-center .lead{margin-bottom:18px}}@media(max-width:360px){.page,.plain-outcome .page{padding-inline:12px}.card{padding-inline:18px}.stage h1{font-size:28px}.date-grid{gap:5px}.date-grid .field{padding-inline:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>

  <div class="page">
