/* [project]/app/design-tokens.css [app-client] (css) */
:root {
  --bg: #f6f4ec;
  --paper: #fffefa;
  --olive: #4d5e3e;
  --ink: #292d27;
  --muted: #71776d;
  --line: #e4e6db;
  --line-strong: #cbd0c0;
  --focus: #a47d3f;
}

/* [project]/app/globals.css [app-client] (css) */
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--ink);
  margin: 0;
  font-family: PT Sans, Arial, sans-serif;
  font-size: 16px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: .55;
}

a {
  color: inherit;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

.shell {
  flex-direction: column;
  max-width: 1440px;
  min-height: 100vh;
  margin: auto;
  padding: 0 58px;
  display: flex;
}

.site-header {
  border-bottom: 1px solid var(--line);
  justify-content: space-between;
  align-items: center;
  height: 96px;
  display: flex;
}

.brand {
  letter-spacing: -.05em;
  align-items: center;
  gap: 12px;
  font-size: 19px;
  font-weight: 700;
  display: flex;
}

.brand-mark {
  color: var(--olive);
  font-size: 31px;
  font-weight: 400;
}

.header-note, .eyebrow, .aside-kicker, .section-number, .card-footer, .footer {
  letter-spacing: .18em;
  font-size: 10px;
  font-weight: 700;
}

.header-note, .aside-kicker, .section-number, .card-footer, .footer {
  color: var(--muted);
}

.layout {
  flex: 1;
  grid-template-columns: minmax(0, 1fr) minmax(500px, 580px);
  align-items: center;
  gap: 52px;
  padding: 50px 0 70px;
  display: grid;
}

.aside {
  min-height: 680px;
  padding: 46px 0;
  position: relative;
}

.aside h2 {
  letter-spacing: -.045em;
  margin: 28px 0;
  font: 500 clamp(42px, 4.3vw, 68px) / 1.14 PT Serif, Georgia, serif;
}

.aside h2 em, .stage h1 em, .policy h1 em {
  color: var(--olive);
  font-weight: 500;
}

.aside p {
  color: var(--muted);
  font-size: 15px;
  position: absolute;
  bottom: 25px;
  left: 0;
}

.orbit {
  opacity: .83;
  place-items: center;
  width: 350px;
  height: 350px;
  margin: 45px auto 0;
  display: grid;
}

.orbit-ring {
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  width: 255px;
  height: 255px;
  position: relative;
  transform: rotate(22.5deg);
}

.orbit-ring:before, .orbit-ring:after {
  content: "";
  border: 1px solid var(--line-strong);
  position: absolute;
  inset: 0;
  transform: rotate(45deg);
}

.orbit-ring:after {
  transform: rotate(90deg);
}

.orbit-ring i {
  background: var(--olive);
  z-index: 1;
  border-radius: 50%;
  width: 8px;
  height: 8px;
  position: absolute;
}

.orbit-ring i:first-child {
  top: -4px;
  left: 50%;
}

.orbit-ring i:nth-child(2) {
  top: 13%;
  right: 13%;
}

.orbit-ring i:nth-child(3) {
  top: 50%;
  right: -4px;
}

.orbit-ring i:nth-child(4) {
  bottom: 13%;
  right: 13%;
}

.orbit-ring i:nth-child(5) {
  bottom: -4px;
  left: 50%;
}

.orbit-ring i:nth-child(6) {
  bottom: 13%;
  left: 13%;
}

.orbit-ring i:nth-child(7) {
  top: 50%;
  left: -4px;
}

.orbit-ring i:nth-child(8) {
  top: 13%;
  left: 13%;
}

.orbit-ring b {
  color: var(--olive);
  font: 400 44px Georgia;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-22.5deg);
}

.flow-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 24px;
  flex-direction: column;
  min-height: 680px;
  padding: 32px 48px 22px;
  display: flex;
  box-shadow: 0 18px 60px #292d200f;
}

.card-top {
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  min-height: 25px;
  display: flex;
}

.eyebrow {
  color: var(--olive);
}

.top-dot {
  padding: 0 8px;
}

.step-label {
  color: var(--muted);
  white-space: nowrap;
  font-size: 12px;
}

.progress-track {
  background: var(--line);
  height: 2px;
  margin: 18px 0 -18px;
}

.progress-track > div {
  background: var(--olive);
  height: 100%;
  transition: width .3s;
}

.stage {
  flex-direction: column;
  flex: 1;
  align-items: flex-start;
  padding-top: 76px;
  animation: .36s both rise;
  display: flex;
}

.section-number {
  margin-bottom: 22px;
}

.stage h1 {
  letter-spacing: -.045em;
  margin: 0 0 23px;
  font: 500 clamp(39px, 4vw, 55px) / 1.17 PT Serif, Georgia, serif;
}

.stage h1.question-title {
  max-width: 450px;
  font-size: clamp(36px, 3.3vw, 48px);
}

.lead {
  color: var(--muted);
  max-width: 410px;
  margin: 0 0 32px;
  line-height: 1.58;
}

.field-label, .date-grid label {
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 700;
  display: block;
}

.stage > input, .date-grid input {
  border: 1px solid var(--line-strong);
  width: 100%;
  height: 60px;
  color: var(--ink);
  background: #fff;
  border-radius: 11px;
  outline: none;
  padding: 0 17px;
  font-size: 17px;
}

.stage > input:focus, .date-grid input:focus {
  border-color: var(--olive);
  box-shadow: 0 0 0 3px #4b5b3b1f;
}

.stage > input::placeholder, .date-grid input::placeholder {
  color: #a5a89c;
}

.primary {
  background: var(--olive);
  color: #fff;
  border: 0;
  border-radius: 12px;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 60px;
  margin-top: 20px;
  padding: 0 22px;
  font-weight: 700;
  transition: background .2s, transform .2s;
  display: flex;
}

.primary:hover:not(:disabled) {
  background: #37452e;
  transform: translateY(-1px);
}

.primary span {
  font-size: 24px;
  font-weight: 400;
}

.hint {
  color: var(--muted);
  margin: 18px 0;
  font-size: 12px;
}

.back {
  min-height: 48px;
  color: var(--olive);
  background: none;
  border: 0;
  padding: 14px 0;
  font-weight: 700;
}

.date-grid {
  grid-template-columns: 1fr 1fr 1.4fr;
  gap: 12px;
  width: 100%;
  display: grid;
}

.date-grid input {
  padding: 0 14px;
}

.date-display {
  color: var(--olive);
  letter-spacing: -.04em;
  padding: 16px 0 25px;
  font: 500 clamp(42px, 5vw, 60px) PT Serif, Georgia, serif;
}

.options {
  gap: 10px;
  width: 100%;
  margin-bottom: 6px;
  display: grid;
}

.option {
  text-align: left;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 12px;
  align-items: center;
  gap: 18px;
  width: 100%;
  min-height: 65px;
  padding: 13px 18px;
  transition: border-color .2s, background .2s, transform .2s;
  display: flex;
}

.option:hover:not(:disabled) {
  border-color: var(--olive);
  transform: translateY(-1px);
}

.option.selected {
  border-color: var(--olive);
  background: #f2f4eb;
}

.option-index {
  color: var(--olive);
  font-size: 11px;
  font-weight: 700;
}

.radio-dot {
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  flex: 0 0 18px;
  width: 18px;
  height: 18px;
  margin-left: auto;
}

.selected .radio-dot {
  border: 5px solid var(--olive);
}

.summary-list {
  width: 100%;
}

.summary-item {
  border-top: 1px solid var(--line);
  justify-content: space-between;
  gap: 16px;
  padding: 16px 0;
  display: flex;
}

.summary-item div {
  gap: 5px;
  display: grid;
}

.summary-item span {
  color: var(--muted);
  font-size: 12px;
}

.summary-item strong {
  font-size: 15px;
}

.summary-item button {
  color: var(--olive);
  background: none;
  border: none;
  align-self: center;
  min-height: 36px;
  font-size: 12px;
  font-weight: 700;
}

.loading-stage {
  text-align: center;
  justify-content: center;
  align-items: center;
  padding-top: 30px;
}

.loading-stage .lead {
  margin: 0 0 10px;
}

.loading-symbol {
  color: var(--olive);
  margin-bottom: 45px;
  font-size: 110px;
  line-height: 1;
  animation: 5s linear infinite spin;
}

.consent {
  color: var(--muted);
  cursor: pointer;
  gap: 12px;
  margin-top: 20px;
  font-size: 13px;
  line-height: 1.5;
  display: flex;
}

.consent input {
  width: 20px;
  height: 20px;
  accent-color: var(--olive);
  flex: 0 0 20px;
  margin: 0;
}

.consent a {
  color: var(--olive);
  font-weight: 700;
}

.success-symbol {
  width: 70px;
  height: 70px;
  color: var(--olive);
  background: #e8eddf;
  border-radius: 50%;
  place-items: center;
  margin-bottom: 28px;
  font-size: 32px;
  display: grid;
}

.help-box {
  background: #f3f4ed;
  border-radius: 14px;
  width: 100%;
  margin-top: 10px;
  padding: 22px;
}

.help-box strong {
  font: 500 23px PT Serif, Georgia, serif;
}

.help-box p {
  color: var(--muted);
  margin: 6px 0 15px;
}

.help-box a {
  color: var(--olive);
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
}

.error {
  color: #8b3027;
  background: #fff0ec;
  border-radius: 10px;
  width: 100%;
  padding: 13px 15px;
  font-size: 13px;
  line-height: 1.4;
}

.card-footer {
  border-top: 1px solid var(--line);
  justify-content: space-between;
  margin-top: 28px;
  padding-top: 21px;
  display: flex;
}

.card-footer span:last-child {
  color: var(--olive);
  font-size: 17px;
}

.footer {
  border-top: 1px solid var(--line);
  letter-spacing: .04em;
  justify-content: space-between;
  align-items: center;
  min-height: 70px;
  display: flex;
}

.footer a {
  text-decoration: none;
}

.policy {
  max-width: 760px;
  margin: 0 auto;
  padding: 80px 24px;
}

.policy .eyebrow {
  margin-top: 85px;
  display: block;
}

.policy h1 {
  font: 500 48px PT Serif, Georgia, serif;
}

.paper {
  background: #fff;
  border-radius: 16px;
  padding: 30px;
  line-height: 1.7;
}

.text-link {
  color: var(--olive);
  font-weight: 700;
  text-decoration: none;
}

.flow-product {
  align-items: center;
  display: flex;
}

.product-badge {
  color: #5b3cc4;
  letter-spacing: .04em;
  background: #eee8ff;
  border-radius: 999px;
  align-items: center;
  min-height: 32px;
  padding: 7px 12px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  display: inline-flex;
}

.flow-status {
  align-items: center;
  gap: 24px;
  display: flex;
}

.flow-date {
  text-align: right;
  gap: 2px;
  display: grid;
}

.flow-date small {
  color: var(--muted);
  font-size: 9px;
}

.flow-date strong {
  font-variant-numeric: tabular-nums;
  font-size: 14px;
}

.context-input {
  resize: vertical;
  border: 1px solid var(--line-strong);
  width: 100%;
  min-height: 150px;
  color: var(--ink);
  font: inherit;
  background: #fff;
  border-radius: 14px;
  outline: none;
  padding: 17px;
  line-height: 1.55;
}

.context-input:focus {
  border-color: var(--olive);
  box-shadow: 0 0 0 3px #4b5b3b1f;
}

.context-input::placeholder {
  color: #9a98a2;
}

.optional-label {
  color: var(--muted);
  margin-left: 7px;
  font-weight: 400;
}

.character-count {
  color: var(--muted);
  align-self: flex-end;
  margin-top: 8px;
  font-size: 10px;
}

.identity-fieldset {
  border: 0;
  width: 100%;
  margin: 24px 0 0;
  padding: 0;
}

.identity-fieldset legend {
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: 700;
}

.identity-options {
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  display: grid;
}

.identity-option {
  border: 1px solid var(--line-strong);
  text-align: left;
  cursor: pointer;
  background: #fff;
  border-radius: 12px;
  justify-content: space-between;
  align-items: center;

}

/* [project]/app/lab/cloud/offer-grid.css [app-client] (css) */
.offer-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: stretch;
  gap: 32px;
  display: grid;
}

.offer-card {
  --offer-bg: #e6f0d5;
  --offer-ink: #293b2d;
  --offer-muted: #506354;
  --offer-accent: #467248;
  --offer-button-ink: #fff;
  isolation: isolate;
  background: var(--offer-bg);
  min-width: 0;
  min-height: 465px;
  color: var(--offer-ink);
  border-radius: 36px;
  flex-direction: column;
  padding: clamp(32px, 2.5vw, 44px);
  display: flex;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px #261e2b0d;
}

.offer-card-prime {
  --offer-bg: #f2dce8;
  --offer-ink: #302631;
  --offer-muted: #665765;
  --offer-accent: #a93978;
}

.offer-card-year {
  --offer-bg: #dfe7fb;
  --offer-ink: #253456;
  --offer-muted: #4c5b78;
  --offer-accent: #3658c8;
}

.offer-card-full {
  --offer-bg: #f5e3ce;
  --offer-ink: #423426;
  --offer-muted: #6b5a49;
  --offer-accent: #a95732;
}

.offer-full-yellow .offer-card-full {
  --offer-bg: #f6e8ae;
  --offer-ink: #41391f;
  --offer-muted: #6c623d;
  --offer-accent: #a87814;
}

.offer-card-main {
  flex: 1;
  grid-template-columns: minmax(0, 1fr) 150px;
  align-items: start;
  gap: 24px;
  display: grid;
}

.offer-card-copy {
  z-index: 1;
  align-self: start;
  position: relative;
}

.offer-kicker, .offer-focus > span {
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--offer-accent);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.4;
  display: block;
}

.cloud-site .offer-card h3 {
  letter-spacing: -.04em;
  color: var(--offer-ink);
  margin: 0 0 14px;
  font-size: clamp(30px, 2.25vw, 38px);
  font-weight: 650;
  line-height: 1.08;
}

.offer-lead {
  max-width: 40ch;
  color: var(--offer-muted);
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
}

.offer-lead strong {
  color: var(--offer-accent);
  font-size: 11px;
  line-height: inherit;
  letter-spacing: .07em;
  text-transform: uppercase;
  font-weight: 750;
}

.offer-layout-subtitle .offer-card-copy > .offer-kicker {
  margin: -2px 0 14px;
}

.offer-focus {
  margin-top: 26px;
}

.offer-focus ul {
  gap: 9px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
}

.offer-focus li {
  color: var(--offer-muted);
  padding-left: 16px;
  font-size: 14px;
  line-height: 1.55;
  position: relative;
}

.offer-focus li:before {
  content: "";
  background: var(--offer-accent);
  opacity: .65;
  border-radius: 50%;
  width: 5px;
  height: 5px;
  position: absolute;
  top: .55em;
  left: 0;
}

.offer-art {
  aspect-ratio: 1;
  place-self: start end;
  place-items: center;
  width: 150px;
  margin-top: -6px;
  display: grid;
  position: relative;
}

.offer-art:before {
  content: "";
  background: color-mix(in srgb,var(--offer-accent),transparent 82%);
  border-radius: 50%;
  position: absolute;
  inset: 9%;
}

.offer-art img {
  object-fit: contain;
  mix-blend-mode: multiply;
  width: 100%;
  height: 100%;
  position: relative;
}

.offer-card-money .offer-art img {
  filter: hue-rotate(190deg) saturate(.78);
}

.offer-card-prime .offer-art img {
  filter: hue-rotate(285deg) saturate(.72);
}

.offer-card-year .offer-art img {
  filter: hue-rotate(190deg) saturate(.85);
}

.offer-card-full .offer-art img {
  filter: sepia(.4) saturate(.9);
}

.offer-card-footer {
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  gap: 13px;
  margin-top: 26px;
  padding-top: 0;
  display: flex;
}

.offer-inquiry {
  align-items: center;
  min-width: 0;
  display: flex;
}

.offer-copy-notice {
  z-index: 50;
  color: #fff;
  white-space: nowrap;
  background: #26212b;
  border-radius: 999px;
  max-width: calc(100vw - 32px);
  padding: 12px 18px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.35;
  animation: .2s ease-out offer-notice-in;
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  box-shadow: 0 12px 36px #1b161f38;
}

.offer-action {
  background: var(--offer-accent);
  min-height: 48px;
  color: var(--offer-button-ink);
  white-space: nowrap;

/* [project]/app/lab/cloud/cloud.css [app-client] (css) */
@font-face {
  font-family: Manrope;
  src: url("/katya-matrix/assets/fonts/Manrope-Variable.ttf") format("truetype");
  font-weight: 200 800;
  font-display: swap;
}

.cloud-site {
  --cloud-ink: #22232d;
  --cloud-muted: #646371;
  --cloud-paper: #fff;
  --cloud-radius: 32px;
  --cloud-gap: 16px;
  --olive: #51427c;
  --muted: #646371;
  --ink: #22232d;
  --line: #e0dfe8;
  --line-strong: #cecadb;
  --focus: #8067b0;
  color: var(--cloud-ink);
  isolation: isolate;
  background: #fff;
  min-height: 100vh;
  padding: 16px;
  font-family: Manrope, Arial, sans-serif;
}

.cloud-site a {
  text-decoration: none;
}

.cloud-site h1, .cloud-site h2, .cloud-site h3, .cloud-site p {
  margin: 0;
}

.cloud-site button, .cloud-site input {
  font-family: inherit;
}

.cloud-nav {
  border-radius: var(--cloud-radius);
  z-index: 5;
  background: #fff;
  justify-content: space-between;
  align-items: center;
  gap: 32px;
  height: 88px;
  margin-bottom: 16px;
  padding: 0 32px;
  display: flex;
  position: relative;
}

.cloud-logo {
  letter-spacing: -1.5px;
  align-items: center;
  gap: 10px;
  font-size: 27px;
  font-weight: 750;
  display: inline-flex;
}

.cloud-logo svg {
  width: 36px;
  height: 36px;
}

.cloud-logo > span {
  letter-spacing: 0;
  align-self: flex-start;
  margin: 8px 0 0 -6px;
  font-size: 12px;
}

.cloud-nav nav {
  align-items: center;
  gap: 42px;
  font-size: 13px;
  font-weight: 550;
  display: flex;
}

.cloud-nav nav a {
  padding: 14px 0;
  transition: color .2s;
}

.cloud-nav nav a:hover {
  color: #8067b0;
}

.cloud-nav nav a:last-child span {
  margin-left: 10px;
}

.cloud-contact {
  border: 1px solid #e3e1e8;
  border-radius: 50%;
  place-items: center;
  width: 44px;
  height: 44px;
  display: grid;
}

.cloud-contact svg {
  width: 21px;
  height: 21px;
}

.cloud-label {
  letter-spacing: .12em;
  font-size: 10px;
  font-weight: 650;
  line-height: 1.5;
}

.cloud-hero {
  border-radius: var(--cloud-radius);
  isolation: isolate;
  z-index: 0;
  background: #ebeaf5;
  grid-template-rows: auto 1fr auto;
  grid-template-columns: 1.3fr 1fr;
  height: calc(100svh - 136px);
  min-height: 540px;
  max-height: 1080px;
  padding: 36px 48px 28px;
  display: grid;
  position: sticky;
  top: 16px;
  overflow: hidden;
}

.cloud-hero:before, .cloud-access-art:before, .cloud-flow-intro:before {
  content: "";
  z-index: -1;
  background: radial-gradient(at 76% 64%, #ecc9db 0, #0000 47%), radial-gradient(at 33% 25%, #e2e9f6 0, #0000 53%), radial-gradient(at 47% 80%, #d4c6ec 0, #0000 57%), #edeaf3;
  animation: 14s ease-in-out infinite alternate cloud-colour-drift;
  position: absolute;
  inset: -25%;
}

.cloud-hero-top {
  grid-column: 1 / -1;
  justify-content: space-between;
  align-items: center;
  display: flex;
}

.cloud-hero-top .cloud-label {
  align-items: center;
  gap: 10px;
  display: flex;
}

.cloud-label i {
  background: currentColor;
  border-radius: 50%;
  width: 6px;
  height: 6px;
  display: inline-block;
}

.cloud-edition {
  color: #656372;
  font-size: 11px;
}

.cloud-hero-copy {
  z-index: 2;
  align-self: center;
  padding: 45px 0;
  position: relative;
}

.cloud-hero h1 {
  letter-spacing: -.035em;
  white-space: nowrap;
  font-size: clamp(54px, 6.3vw, 112px);
  font-weight: 600;
  line-height: 1.06;
}

.cloud-hero h1 > span {
  color: #777385;
}

.cloud-hero-copy > p {
  letter-spacing: -.025em;
  color: #5d586c;
  max-width: 430px;
  margin: 28px 0 30px;
  font-size: clamp(15px, 1.3vw, 20px);
  line-height: 1.65;
}

.cloud-button {
  color: #fff;
  background: #292631;
  border: 0;
  border-radius: 99px;
  justify-content: space-between;
  align-items: center;
  gap: 42px;
  min-height: 56px;
  padding: 16px 24px;
  font-size: 13px;
  font-weight: 550;
  transition: background .2s, transform .2s;
  display: inline-flex;
}

.cloud-button:hover:not(:disabled) {
  background: #514666;
  transform: translateY(-2px);
}

.cloud-button > span {
  font-size: 22px;
  line-height: 1;
}

.cloud-hero-art {
  justify-content: center;
  align-self: stretch;
  align-items: center;
  min-width: 0;
  display: flex;
  position: relative;
}

.cloud-object {
  aspect-ratio: 1;
  perspective: 1100px;
  flex: none;
  width: clamp(280px, 31vw, 520px);
  animation: 9s ease-in-out infinite cloud-object-float;
  position: relative;
  transform: rotate(-12deg);
}

.cloud-object-orbit {
  border: 1px solid #a69ac13b;
  border-radius: 50%;
  position: absolute;
  inset: 4%;
  transform: rotateX(58deg) rotateZ(-22deg);
}

.cloud-object-frame {
  background: linear-gradient(130deg, #eadfea50, #d6c2e033);
  border: clamp(16px, 2.9vw, 48px) solid #c1b1db;
  border-radius: 19%;
  animation: 16s ease-in-out infinite alternate cloud-frame-turn;
  position: absolute;
  inset: 17%;
  transform: rotate(0) rotateY(-18deg) rotateX(12deg);
  box-shadow: inset 4px 4px 6px #ffffffb8, inset -4px -4px 8px #8e7ca86b, 7px 10px 14px #84749725, -4px -4px 12px #ffffff8c;
}

.frame-two {
  mix-blend-mode: multiply;
  border-color: #e7ccdd;
  animation-name: cloud-frame-turn-two;
  transform: rotate(45deg) rotateY(-18deg) rotateX(12deg);
}

.cloud-object-core {
  aspect-ratio: 1;
  background: radial-gradient(circle at 31% 25%, #fff2f1, #e5bfcf 52%, #a295bd);
  border-radius: 50%;
  width: 19%;
  position: absolute;
  top: 40.5%;
  left: 40.5%;
  box-shadow: 8px 14px 21px #88719636;
}

.cloud-object-point {
  background: #a28fb6;
  border-radius: 50%;
  width: 8px;
  height: 8px;
  position: absolute;
}

.point-one {
  top: 30%;
  left: 10%;
}

.point-two {
  width: 5px;
  height: 5px;
  bottom: 22%;
  right: 9%;
}

.point-three {
  width: 4px;
  height: 4px;
  top: 5%;
  right: 25%;
}

.cloud-art-caption {
  white-space: nowrap;
  letter-spacing: .15em;
  color: #71667e;
  font-size: 8px;
  position: absolute;
  bottom: 15%;
  left: 50%;
  transform: translateX(-50%);
}

.cloud-hero-bottom {
  color: #676171;
  border-top: 1px solid #837c9630;
  grid-column: 1 / -1;
  justify-content: space-between;
  align-items: center;
  padding-top: 22px;
  font-size: 10px;
  display: flex;
}

.cloud-hero-bottom a {
  color: #332e41;
  align-items: center;
  gap: 30px;
  display: flex;
}

.cloud-hero-bottom a span {
  font-size: 18px;
}

.cloud-hero-number {
  font-variant-numeric: tabular-nums;
}

.cloud-content-layer {
  z-index: 2;
  border-radius: var(--cloud-radius);
  background: #fff;
  margin-top: 16px;
  position: relative;
  overflow: clip;
  box-shadow: 0 -24px 80px #5140640a;
}

.cloud-approach {
  padding: 52px 48px 30px;
  scroll-margin-top: 16px;
}

.cloud-section-label {
  justify-content: space-between;
  align-items: center;
  display: flex;
}

.cloud-small-mark svg {
  color: #aca5bf;
  width: 36px;
  height: 36px;
}

.cloud-approach-body {
  grid-template-columns: 1.3fr 1fr;
  align-items: start;
  gap: 70px;
  margin: 58px 0 72px;
  display: grid;
}

.cloud-approach h2 span {
  color: #aaa6b3;
}

.cloud-approach-text {
  max-width: 440px;
  padding-top: 5px;
}

.cloud-approach-text p {
  color: #63606d;
  font-size: 14px;
  line-height: 1.8;
}

.cloud-approach-text p + p {
  margin-top: 18px;
}

.cloud-approach-footer {
  color: #89828f;
  border-top: 1px solid #eeecf1;
  justify-content: space-between;
  gap: 24px;
  padding-top: 24px;
  font-size: 10px;
  display: flex;
}

.cloud-formats {
  padding: 64px 48px 72px;
  scroll-margin-top: 16px;
}

.cloud-formats-heading {
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 32px;
  display: flex;
}

.cloud-formats h2 {
  margin-top: 18px;
}

.cloud-formats-heading > p {
  color: #77707f;
  font-size: 13px;
  line-height: 1.65;
}

.cloud-product-list {
  gap: 16px;
  display: grid;
}

.cloud-product {
  background: #f3f2f7;
  border-radius: 32px;
  grid-template-columns: 180px minmax(0, 1fr) 200px;
  align-items: center;
  gap: 40px;
  min-height: 242px;
  padding: 26px 32px 26px 26px;
  display: grid;
}

.cloud-product-symbol {
  aspect-ratio: 1;
  background: #e6e2f1;
  border-radius: 24px;
  place-items: center;
  width: 170px;
  display: grid;
  position: relative;
  overflow: hidden;
}

.cloud-product-symbol > span {
  color: #a899c0;
  z-index: 1;
  font-size: 135px;
  font-weight: 400;
  line-height: 1;
  animation: 24s ease-in-out infinite alternate cloud-symbol-turn;
}

.cloud-product-symbol > i {
  border: 1px solid #fff9;
  border-radius: 50%;
  width: 110px;
  height: 110px;
  position: absolute;
}

.cloud-product-consult {
  background: #f7f2f3;
}

.cloud-product-consult .cloud-product-symbol {
  background: #eddfdf;
}

.cloud-product-consult .cloud-product-symbol > span {
  color: #ba9da5;
  font-size: 115px;
  animation: none;
  transform: rotate(-12deg);
}

.cloud-product-money {
  background: #edf0f6;
}

.cloud-product-money .cloud-product-symbol {
  background: #dfe4f0;
}

.cloud-product-money .cloud-product-symbol > span {
  color: #9ba8c6;
  font-size: 120px;
  animation: none;
}

.cloud-product-copy .cloud-label {
  color: #77717f;
  font-size: 8px;
}

.cloud-product h3 {
  letter-spacing: -.03em;
  margin: 14px 0;
  font-size: clamp(23px, 2.3vw, 37px);
  font-weight: 550;
  line-height: 1.16;
}

.cloud-product-copy > p {
  color: #716978;
  max-width: 420px;
  font-size: 13px;
  line-height: 1.75;
}

.cloud-product-action, .cloud-product-info summary {
  cursor: pointer;
  border: 1px solid #ccc6d5;
  border-radius: 99px;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  min-height: 49px;
  padding: 14px 19px;
  font-size: 11px;
  list-style: none;
  display: flex;
}

.cloud-product-info summary::-webkit-details-marker {
  display: none;
}

.cloud-product-info summary > span, .cloud-product-action > span {
  font-size: 20px;
}

.cloud-product-info > p {
  color: #716978;
  margin-top: 14px;
  font-size: 11px;
  line-height: 1.7;
}

.cloud-product-info[open] summary > span {
  transform: rotate(45deg);
}

.cloud-ending {
  background: #eee9f3;
  border-radius: 32px;
  grid-template-columns: 1.3fr 1fr;
  gap: 38px 70px;
  margin: 0 16px;
  padding: 44px 32px;
  display: grid;
  position: relative;
}

.cloud-ending > .cloud-label {
  color: #787081;
  grid-column: 1 / -1;
}

.cloud-ending > div > p {
  color: #716978;
  margin-bottom: 22px;
  font-size: 13px;
  line-height: 1.7;
}

.cloud-contact-note {
  color: #827788;
  border-top: 1px solid #dcd4e6;
  grid-column: 1 / -1;
  padding-top: 16px;
  font-size: 10px;
}

.cloud-footer {
  justify-content: space-between;
  align-items: center;
  gap: 28px;
  padding: 48px;
  display: flex;
}

.cloud-footer > .cloud-logo {
  font-size: 23px;
}

.cloud-footer > span {
  color: #8c8493;
  font-size: 11px;
}

.cloud-footer nav {
  gap: 22px;
  font-size: 10px;
  display: flex;
}

.cloud-access, .cloud-flow-wrap {
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  display: grid;
}

.cloud-access-art, .cloud-flow-intro {
  isolation: isolate;
  background: #e9e5f3;
  border-radius: 32px;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  min-height: 760px;
  padding: 40px;
  display: flex;
  position: relative;
  overflow: hidden;
}

.cloud-access-art h1 {
  z-index: 1;
  margin-top: 35px;
  position: relative;
}

.cloud-access-art .cloud-object {
  align-self: center;
  width: clamp(240px, 27vw, 470px);
  margin: 5px 0 20px;
}

.cloud-access-content {
  background: #fff;
  border-radius: 32px;
  flex-direction: column;
  justify-content: center;
  padding: 48px clamp(28px, 4vw, 70px);
  display: flex;
}

.cloud-access-content > h2 {
  margin: 24px 0;
}

.cloud-access-content > p {
  color: #6c6476;
  max-width: 450px;
  font-size: 13px;
  line-height: 1.8;
}

.cloud-access-content > p.cloud-access-note {
  color: #8b8294;
  margin-top: 14px;
  font-size: 11px;
}

.cloud-code-form {
  border-top: 1px solid #e9e4ee;
  margin-top: 35px;
  padding-top: 28px;
}

.cloud-code-form p {
  color: #7d7289;
  margin: 10px 0 22px;
  font-size: 12px;
  line-height: 1.7;
}

.cloud-code-form label {
  margin-bottom: 10px;
  font-size: 11px;
  font-weight: 600;
  display: block;
}

.cloud-code-form input {
  color: #292631;
  background: #faf9fc;
  border: 1px solid #d9d2e2;
  border-radius: 16px;
  width: 100%;
  height: 58px;
  padding: 0 18px;
  font-size: 15px;
}

.cloud-code-form .cloud-button {
  width: 100%;
  margin-top: 12px;
}

.cloud-back {
  color: #7c6e8e;
  margin-top: 24px;
  font-size: 11px;
  display: inline-block;
}
